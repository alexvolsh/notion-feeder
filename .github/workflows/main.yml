name: Get Feed

on:
  schedule:
    - cron: '0 4,12,20 * * *' # 7:00, 15:00, 23:00
  workflow_dispatch:

jobs:
  get-feed:
    runs-on: ubuntu-latest
    env:
      NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
      NOTION_READER_DATABASE_ID: ${{ secrets.NOTION_READER_DATABASE_ID }}
      NOTION_FEEDS_DATABASE_ID: ${{ secrets.NOTION_FEEDS_DATABASE_ID }}
      RUN_FREQUENCY: 28800 # in seconds
    steps:
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 18

      - name: Update Notion Feed
        run: |
          curl -o index.js https://raw.githubusercontent.com/alexvolsh/notion-feeder/build/dist/index.js
          node index.js
